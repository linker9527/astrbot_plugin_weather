name: astrbot_plugin_weather
display_name: 天气查询
author: linker9527
description: 免费天气查询，基于 wttr.in 公开服务，无需 API Key、无需注册、零成本。支持当前实况、三天预报、一行速览和 PNG 天气图，中文地名/机场码/坐标都能查，可用命令或 LLM 自然语言调用。
short_desc: 用 wttr.in 免费查天气：当前实况、三天预报、天气图，免 API Key、免注册
version: 1.2.0
repo: https://github.com/chubin/wttr.in
category: 工具
tags:
  - 天气
  - wttr.in
  - 查询
help: |
  免费天气查询（基于 wttr.in 公开服务，无需 API Key、无需注册）。

  命令（统一入口 /weather，地点在前，参数在后；参数也可写在地点前）:
  /weather                   查默认城市当前天气（不是帮助）
  /weather [地点]            当前天气实况
  /weather [地点] now        一行速览（适合状态栏）
  /weather [地点] forecast   未来 3 天预报
  /weather [地点] 3         未来 3 天预报（末尾数字 1~3 指定天数，上游最多 3 天）
  /weather [地点] img / 图片  PNG 天气图
  /weather help / 帮助        显示帮助（只有这两个才是帮助）

  参数别名: now=速览/一行/oneline；forecast=预报/多日；pic=img/png/图片/天气图；help=帮助
  命令别名: /天气 /tianqi /wttr（走同一入口）；预报快捷命令 /forecast /天气预报 /预报

  地点支持中文（北京）、英文（London）、机场三字码（muc）；
  留空则使用插件配置里的默认城市。
  开启「LLM 天气工具」后可直接用自然语言问天气。
